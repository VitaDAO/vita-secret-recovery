name: Attest isolated encrypted recovery configuration
on:
  push:
    tags: ['recovery-v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: tinfoilsh/measure-image-action@beba4296251f7a9bc44b481ebafe4863509e4380
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mark-as-latest: 'false'
